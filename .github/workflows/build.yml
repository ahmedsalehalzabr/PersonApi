name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release

    - name: Build Docker image
      run: docker build -t personapi:ci .

    - name: Run Mock Server and Postman Tests
      run: |
        # تثبيت خادم وهمي بسيط
        npm install -g http-server
        # إنشاء ملفات وهمية للاستجابة
        echo '{"id":1,"name":"Test","address":"Addr","work":"Work","age":31}' > person.json
        echo '[]' > persons.json
        # تشغيل الخادم الوهمي في الخلفية
        http-server -p 8080 --cors &
        # الانتظار 3 ثواني
        sleep 3
        
        # تثبيت Newman وتشغيل الاختبارات
        npm install -g newman
        newman run postman/collection.json -e postman/environment.json