name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release

    - name: Build Docker image
      run: docker build -t personapi:ci .

    - name: Run Postman Tests (Mock)
      run: |
        npm install -g newman
        # تشغيل خادم وهمي بسيط جداً في الخلفية
        node -e "require('http').createServer((req, res) => { res.writeHead(200); res.end(); }).listen(8080)" &
        sleep 3
        # تشغيل Newman
        newman run postman/collection.json -e postman/environment.json