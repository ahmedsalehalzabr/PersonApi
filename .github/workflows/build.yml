name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
          POSTGRES_DB: persons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: dotnet test --no-build -c Release

    - name: Build Docker image
      run: docker build -t personapi:ci .

    - name: Run Application in Background
      run: |
        docker run -d --name myapp -p 8080:8080 \
          -e "ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=persons;Username=program;Password=test" \
          -e "ASPNETCORE_ENVIRONMENT=Development" \
          personapi:ci
        sleep 20

    - name: Run Postman Tests
      run: |
        npm install -g newman
        newman run postman/collection.json -e postman/environment.json